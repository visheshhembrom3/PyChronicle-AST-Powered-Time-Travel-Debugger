{% extends "base.html" %}

{% block title %}Set New Password — PyChronicle{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo-badge">🔒</div>
            <h1 class="auth-title">New Password</h1>
            <p class="auth-subtitle">Create a secure new password for your account</p>
        </div>

        {% if error %}
            <div class="form-alert form-alert-error" id="reset-error-alert">
                <span>⚠</span> {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.reset_password') }}" class="auth-form" id="reset-password-form">
            <input type="hidden" name="token" value="{{ token }}">

            <div class="form-group">
                <label for="password" class="form-label">New Password <span class="label-hint">(min 6 chars)</span></label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="Enter new password" 
                    minlength="6"
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input 
                    type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    class="form-input" 
                    placeholder="Re-enter new password" 
                    minlength="6"
                    required
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-submit-btn">
                    RESET PASSWORD
                </button>
            </div>

            <div class="auth-footer-note">
                <a href="{{ url_for('auth.login') }}" class="link-primary">Cancel and Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
