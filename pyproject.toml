[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pychronicle"
version = "0.1.0"
description = "AST-powered Python time-travel debugger with delta state capture and SQLite replay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "textual>=0.70.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
pychronicle = "main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
